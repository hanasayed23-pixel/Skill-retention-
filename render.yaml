services:
  - type: web
    name: aswan-skills-pilot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn 'app:create_app()' --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: STUDY_CONTACT
        sync: false
      - key: LIVE_RECRUITMENT
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: aswan-skills-database
          property: connectionString
databases:
  - name: aswan-skills-database
    plan: free
