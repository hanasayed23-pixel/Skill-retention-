{% extends 'base.html' %}{% block body %}<h1>Final questions / أسئلة أخيرة</h1><form action="{{url_for('debrief')}}" method="post"><input type="hidden" name="csrf" value="{{csrf_token()}}"><label>Overall difficulty / مستوى الصعوبة<select name="difficulty" required><option value="">Choose / اختر</option><option value="Easy">Easy / {{ARABIC["Easy"]}}</option><option value="Manageable">Manageable / {{ARABIC["Manageable"]}}</option><option value="Difficult">Difficult / {{ARABIC["Difficult"]}}</option></select></label><label>Did you practise similar skills outside the study? / هل تدربت على مهارات مشابهة خارج الدراسة؟<select name="outside_practice" required><option value="">Choose / اختر</option><option value="Yes">Yes / {{ARABIC["Yes"]}}</option><option value="No">No / {{ARABIC["No"]}}</option><option value="Unsure">Unsure / {{ARABIC["Unsure"]}}</option></select></label><label>Did you change device between sessions? / هل غيّرت الجهاز بين الجلستين؟<select name="device_changed" required><option value="">Choose / اختر</option><option value="Yes">Yes / {{ARABIC["Yes"]}}</option><option value="No">No / {{ARABIC["No"]}}</option></select></label><label>Optional feedback, without names / ملاحظات اختيارية دون أسماء<textarea name="comment" maxlength="1000" rows="4"></textarea></label><button>Finish / إنهاء</button></form>{% endblock %}
